<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灘校84回生＋αグループ - 管理サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    .admin-container { display: flex; min-height: 100vh; }
    
    .sidebar { width: 250px; background-color: #2c3e50; color: #fff; padding: 20px; transition: transform 0.3s ease; }
    .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
    .sidebar ul { list-style: none; }
    .sidebar li a { color: #ecf0f1; text-decoration: none; display: block; padding: 10px; border-radius: 4px; margin-bottom: 5px; }
    .sidebar li a.active, .sidebar li a:hover { background-color: #34495e; }
    
    .hamburger { display: none; position: fixed; top: 15px; left: 15px; z-index: 1000; font-size: 24px; background: #2c3e50; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    .content { flex: 1; padding: 40px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="text"] { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 4px; cursor: pointer; }

    /* --- botステータス表示用スタイル --- */
    .bot-status-container {
      margin-bottom: 25px;
      padding: 15px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bot-status-label {
      font-weight: bold;
      font-size: 1rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      color: white;
      transition: all 0.3s ease;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: white;
    }
    /* オンライン (はっきりした緑) */
    .status-badge.online {
      background-color: #2ecc71;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
    }
    /* オフライン (はっきりした赤) */
    .status-badge.offline {
      background-color: #e74c3c;
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
    }

    /* バージョン入力フォーム (横幅固定) */
    .version-input-container {
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .version-prefix {
      white-space: nowrap;
    }
    .version-part-first {
      width: 60px !important;
      text-align: center;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .version-part {
      width: 50px !important;
      text-align: center;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* ツールバーとアクティブボタン */
    .toolbar { display: flex; gap: 5px; margin-bottom: 5px; background: #eef2f5; padding: 6px; border-radius: 4px 4px 0 0; border: 1px solid #ccc; border-bottom: none; }
    .toolbar button { padding: 6px 12px; border: 1px solid #aaa; background: #fff; border-radius: 3px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .toolbar button:hover { background: #e2e8f0; }
    .toolbar button.active { background-color: #3498db; color: white; border-color: #2980b9; }

    /* エディタ領域 */
    .editor-area {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 0 0 4px 4px;
      background: #fff;
      overflow-y: auto;
      line-height: 1.6;
      white-space: pre-wrap;
      outline: none;
    }
    .editor-area:focus {
      border-color: #3498db;
    }

    /* 編集画面におけるネタバレタグ */
    .editor-area .spoiler {
      background-color: #f0f4f8;
      color: #555;
      border: 1px dashed #cbd5e0;
      border-radius: 3px;
      padding: 0 4px;
    }

    /* 閲覧画面におけるネタバレタグ */
    .markdown-body .spoiler {
      background-color: #4f545c;
      color: transparent;
      border-radius: 3px;
      padding: 0 4px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .markdown-body .spoiler.revealed {
      background-color: #b9bbbe;
      color: #2e3136;
      cursor: text;
      user-select: text;
    }

    .markdown-body { line-height: 1.6; white-space: pre-wrap; }
    .action-buttons { margin-top: 15px; display: flex; gap: 10px; }
    .btn { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .hidden { display: none; }

    .footer-preview { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 0.85rem; color: #666; }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 999; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 60px 20px 20px 20px; }
    }
  </style>
</head>
<body>

  <button class="hamburger" id="hamburger-btn">☰</button>

  <div class="admin-container">
    <nav class="sidebar" id="sidebar">
      <h2>灘校84回生＋α</h2>
      <ul>
        <li><a href="#" id="menu-version">bot設定</a></li>
        <li><a href="#" class="active" id="menu-terms">利用規約</a></li>
      </ul>
    </nav>

    <main class="content">
      <div class="card">
        <div class="card-header">
          <h2 id="page-title">利用規約</h2>
          <button id="edit-btn" class="btn btn-primary">編集</button>
        </div>

        <div id="section-version" class="hidden">
          
          <div class="bot-status-container">
            <span class="bot-status-label">botのステータス:</span>
            <div id="bot-status-badge" class="status-badge online">
              <span class="status-dot"></span>
              <span id="bot-status-text">オンライン</span>
            </div>
          </div>

          <div id="version-view">
            <p>現在のボットバージョン: <strong id="version-display">1.00.00</strong></p>
          </div>
          <div id="version-edit" class="hidden">
            <div class="form-group">
              <label>ボットバージョン設定</label>
              <div class="version-input-container">
                <span class="version-prefix">N84ボット v</span>
                <input type="text" id="v-major" class="version-part-first" maxlength="3" placeholder="1">
                <span>.</span>
                <input type="text" id="v-minor" class="version-part" maxlength="2" placeholder="00">
                <span>.</span>
                <input type="text" id="v-patch" class="version-part" maxlength="2" placeholder="00">
              </div>
            </div>
            <div class="action-buttons">
              <button id="save-version-btn" class="btn btn-success">保存してDiscordへ反映</button>
              <button class="btn btn-secondary cancel-btn">キャンセル</button>
            </div>
          </div>
        </div>

        <div id="section-terms">
          <div id="terms-view">
            <h3 id="terms-title-display" style="margin-bottom: 10px;">📜 利用規約 - 灘校84回生＋αグループ</h3>
            <div id="terms-text-display" class="markdown-body">ここに利用規約のテキストが表示されます。</div>
            <div class="footer-preview">
              フッター: <span id="footer-preview-display">N84ボット v1.00.00</span>
            </div>
          </div>

          <div id="terms-edit" class="hidden">
            <div class="form-group">
              <label for="terms-title-input">タイトル（任意）</label>
              <input type="text" id="terms-title-input" style="width: 100%;" placeholder="タイトルなしにする場合は空欄">
            </div>

            <div class="form-group">
              <label for="terms-color-input">埋め込みカラー (Embed Color)</label>
              <div class="color-picker-wrapper">
                <input type="color" id="terms-color-input" value="#3498db">
                <span id="color-code-text">#3498db</span>
              </div>
            </div>

            <div class="form-group">
              <label>規約本文（必須）</label>
              <div class="toolbar">
                <button type="button" id="btn-bold" title="太字"><b>B</b></button>
                <button type="button" id="btn-italic" title="斜体"><i>I</i></button>
                <button type="button" id="btn-underline" title="下線"><u>U</u></button>
                <button type="button" id="btn-strike" title="打ち消し線"><s>S</s></button>
                <button type="button" id="btn-spoiler" title="ネタバレ防止">|| ネタバレ ||</button>
              </div>
              <div id="editor" class="editor-area" contenteditable="true"></div>
            </div>

            <div class="action-buttons">
              <button id="save-terms-btn" class="btn btn-success">保存してDiscordへ送信</button>
              <button class="btn btn-secondary cancel-btn">キャンセル</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // localStorage からデータを読み込み
    let currentVersion = localStorage.getItem('n84_version') || "1.00.00";
    let currentTitle = localStorage.getItem('n84_title') ?? "📜 利用規約 - 灘校84回生＋αグループ";
    let currentMarkdownContent = localStorage.getItem('n84_content') || "ここに **利用規約** のテキストが表示されます。\n||ネタバレ注意|| の内容や __下線__ も選択可能です。";
    let currentColor = localStorage.getItem('n84_color') || "#3498db";
    let isBotOnline = true; // デフォルトはオンライン（※API連携時に自動切り替え可能）
    let currentTab = "terms";

    function saveToLocalStorage() {
      localStorage.setItem('n84_version', currentVersion);
      localStorage.setItem('n84_title', currentTitle);
      localStorage.setItem('n84_content', currentMarkdownContent);
      localStorage.setItem('n84_color', currentColor);
    }

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const menuVersion = document.getElementById('menu-version');
    const menuTerms = document.getElementById('menu-terms');
    
    const pageTitle = document.getElementById('page-title');
    const editBtn = document.getElementById('edit-btn');
    
    const sectionVersion = document.getElementById('section-version');
    const versionView = document.getElementById('version-view');
    const versionEdit = document.getElementById('version-edit');
    const versionDisplay = document.getElementById('version-display');
    const vMajor = document.getElementById('v-major');
    const vMinor = document.getElementById('v-minor');
    const vPatch = document.getElementById('v-patch');
    const saveVersionBtn = document.getElementById('save-version-btn');

    const botStatusBadge = document.getElementById('bot-status-badge');
    const botStatusText = document.getElementById('bot-status-text');

    const sectionTerms = document.getElementById('section-terms');
    const termsView = document.getElementById('terms-view');
    const termsEdit = document.getElementById('terms-edit');
    const termsTitleDisplay = document.getElementById('terms-title-display');
    const termsTextDisplay = document.getElementById('terms-text-display');
    const footerPreviewDisplay = document.getElementById('footer-preview-display');
    
    const termsTitleInput = document.getElementById('terms-title-input');
    const termsColorInput = document.getElementById('terms-color-input');
    const colorCodeText = document.getElementById('color-code-text');
    const editor = document.getElementById('editor');
    const saveTermsBtn = document.getElementById('save-terms-btn');
    
    const btnBold = document.getElementById('btn-bold');
    const btnItalic = document.getElementById('btn-italic');
    const btnUnderline = document.getElementById('btn-underline');
    const btnStrike = document.getElementById('btn-strike');
    const btnSpoiler = document.getElementById('btn-spoiler');

    const cancelBtns = document.querySelectorAll('.cancel-btn');

    // botのステータス表示を更新する関数
    function updateBotStatus(online) {
      isBotOnline = online;
      if (isBotOnline) {
        botStatusBadge.className = "status-badge online";
        botStatusText.innerText = "オンライン";
      } else {
        botStatusBadge.className = "status-badge offline";
        botStatusText.innerText = "オフライン";
      }
    }

    function formatDoc(cmd) {
      document.execCommand(cmd, false, null);
      checkActiveStyles();
      editor.focus();
    }

    function applySpoiler() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const span = document.createElement("span");
      span.className = "spoiler";
      span.appendChild(range.extractContents());
      range.insertNode(span);
      checkActiveStyles();
      editor.focus();
    }

    btnBold.addEventListener('click', () => formatDoc('bold'));
    btnItalic.addEventListener('click', () => formatDoc('italic'));
    btnUnderline.addEventListener('click', () => formatDoc('underline'));
    btnStrike.addEventListener('click', () => formatDoc('strikeThrough'));
    btnSpoiler.addEventListener('click', () => applySpoiler());

    function checkActiveStyles() {
      btnBold.classList.toggle('active', document.queryCommandState('bold'));
      btnItalic.classList.toggle('active', document.queryCommandState('italic'));
      btnUnderline.classList.toggle('active', document.queryCommandState('underline'));
      btnStrike.classList.toggle('active', document.queryCommandState('strikeThrough'));

      const selection = window.getSelection();
      if (selection.rangeCount > 0) {
        let node = selection.getRangeAt(0).startContainer;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
        btnSpoiler.classList.toggle('active', !!(node.classList && node.classList.contains('spoiler')));
      }
    }

    editor.addEventListener('keyup', checkActiveStyles);
    editor.addEventListener('mouseup', checkActiveStyles);
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === editor) {
        checkActiveStyles();
      }
    });

    [vMajor, vMinor, vPatch].forEach((input, idx, arr) => {
      input.addEventListener('input', () => {
        if (input.value.length >= input.maxLength && idx < arr.length - 1) {
          arr[idx + 1].focus();
        }
      });
    });

    function markdownToHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.add(\'revealed\')">$1</span>')
        .replace(/__(.*?)__/g, '<u>$1</u>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/~~(.*?)~~/g, '<s>$1</s>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/\n/g, '<br>');
    }

    function htmlToMarkdown(node) {
      let md = "";
      for (let child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) {
          md += child.textContent;
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName.toLowerCase();
          let inner = htmlToMarkdown(child);
          
          if (child.classList.contains("spoiler")) {
            md += `||${inner}||`;
          } else if (tag === "b" || tag === "strong") {
            md += `**${inner}**`;
          } else if (tag === "i" || tag === "em") {
            md += `*${inner}*`;
          } else if (tag === "u") {
            md += `__${inner}__`;
          } else if (tag === "s" || tag === "strike") {
            md += `~~${inner}~~`;
          } else if (tag === "br") {
            md += "\n";
          } else if (tag === "div" || tag === "p") {
            md += "\n" + inner;
          } else {
            md += inner;
          }
        }
      }
      return md;
    }

    function renderView() {
      if (currentTitle.trim()) {
        termsTitleDisplay.innerText = currentTitle;
        termsTitleDisplay.style.display = "block";
      } else {
        termsTitleDisplay.style.display = "none";
      }
      termsTextDisplay.innerHTML = markdownToHtml(currentMarkdownContent);
      versionDisplay.innerText = currentVersion;
      footerPreviewDisplay.innerText = `N84ボット v${currentVersion}`;
    }
    renderView();

    termsColorInput.addEventListener('input', (e) => {
      colorCodeText.innerText = e.target.value;
    });

    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

    function switchTab(tab) {
      currentTab = tab;
      exitEditMode();

      if (tab === 'version') {
        menuVersion.classList.add('active');
        menuTerms.classList.remove('active');
        sectionVersion.classList.remove('hidden');
        sectionTerms.classList.add('hidden');
        pageTitle.innerText = "bot設定"; // タイトル表示を更新
      } else {
        menuTerms.classList.add('active');
        menuVersion.classList.remove('active');
        sectionTerms.classList.remove('hidden');
        sectionVersion.classList.add('hidden');
        pageTitle.innerText = "利用規約";
      }
    }

    menuVersion.addEventListener('click', (e) => { e.preventDefault(); switchTab('version'); });
    menuTerms.addEventListener('click', (e) => { e.preventDefault(); switchTab('terms'); });

    editBtn.addEventListener('click', () => {
      editBtn.classList.add('hidden');

      if (currentTab === 'version') {
        const parts = currentVersion.split('.');
        vMajor.value = parts[0] || '';
        vMinor.value = parts[1] || '';
        vPatch.value = parts[2] || '';

        versionView.classList.add('hidden');
        versionEdit.classList.remove('hidden');
      } else {
        termsTitleInput.value = currentTitle;
        termsColorInput.value = currentColor;
        colorCodeText.innerText = currentColor;
        
        editor.innerHTML = markdownToHtml(currentMarkdownContent);
        
        termsView.classList.add('hidden');
        termsEdit.classList.remove('hidden');
        checkActiveStyles();
      }
    });

    function exitEditMode() {
      editBtn.classList.remove('hidden');
      versionView.classList.remove('hidden');
      versionEdit.classList.add('hidden');
      termsView.classList.remove('hidden');
      termsEdit.classList.add('hidden');
    }

    cancelBtns.forEach(btn => btn.addEventListener('click', exitEditMode));

    async function sendUpdateToDiscord(payload) {
      return await fetch('/.netlify/functions/update-terms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    saveTermsBtn.addEventListener('click', async () => {
      const newTitle = termsTitleInput.value.trim();
      const newColor = termsColorInput.value;
      const newMarkdownContent = htmlToMarkdown(editor).trim();

      if (!newMarkdownContent) {
        alert("利用規約の本文は必須です。内容を入力してください。");
        return;
      }

      saveTermsBtn.disabled = true;
      saveTermsBtn.innerText = "送信中...";

      try {
        const res = await sendUpdateToDiscord({
          title: newTitle,
          content: newMarkdownContent,
          color: newColor,
          version: currentVersion
        });

        if (res.ok) {
          currentTitle = newTitle;
          currentColor = newColor;
          currentMarkdownContent = newMarkdownContent;

          saveToLocalStorage();
          renderView();
          
          alert("利用規約を更新しました。");
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        console.error(err);
        alert("通信エラーが発生しました。");
      } finally {
        saveTermsBtn.disabled = false;
        saveTermsBtn.innerText = "保存してDiscordへ送信";
      }
    });

    saveVersionBtn.addEventListener('click', async () => {
      const maj = vMajor.value.trim();
      const min = vMinor.value.trim();
      const pat = vPatch.value.trim();

      if (maj === '' || min === '' || pat === '') {
        alert("バージョンの枠をすべて入力してください。");
        return;
      }

      const newVersion = `${maj}.${min}.${pat}`;

      saveVersionBtn.disabled = true;
      saveVersionBtn.innerText = "送信中...";

      try {
        const res = await sendUpdateToDiscord({
          title: currentTitle,
          content: currentMarkdownContent,
          color: currentColor,
          version: newVersion
        });

        if (res.ok) {
          currentVersion = newVersion;

          saveToLocalStorage();
          renderView();
          
          alert(`バージョンを v${currentVersion} に更新しました。`);
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        console.error(err);
        alert("通信エラーが発生しました。");
      } finally {
        saveVersionBtn.disabled = false;
        saveVersionBtn.innerText = "保存してDiscordへ反映";
      }
    });
  </script>
</body>
</html>
