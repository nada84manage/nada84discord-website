<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灘校84回生＋αグループ - 管理サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    .admin-container { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background-color: #2c3e50; color: #fff; padding: 20px; transition: transform 0.3s ease; }
    .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
    .sidebar ul { list-style: none; }
    .sidebar li a { color: #ecf0f1; text-decoration: none; display: block; padding: 10px; border-radius: 4px; }
    .sidebar li a.active, .sidebar li a:hover { background-color: #34495e; }
    .hamburger { display: none; position: fixed; top: 15px; left: 15px; z-index: 1000; font-size: 24px; background: #2c3e50; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    .content { flex: 1; padding: 40px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    textarea { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    .action-buttons { margin-top: 10px; display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 999; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 60px 20px 20px 20px; }
    }
  </style>
</head>
<body>

  <button class="hamburger" id="hamburger-btn">☰</button>

  <div class="admin-container">
    <nav class="sidebar" id="sidebar">
      <h2>灘校84回生＋α</h2>
      <ul>
        <li><a href="#" class="active" id="menu-terms">利用規約</a></li>
      </ul>
    </nav>

    <main class="content">
      <div class="card">
        <div class="card-header">
          <h2>利用規約</h2>
          <button id="edit-btn" class="btn btn-primary">編集</button>
        </div>

        <div id="view-section" class="terms-body">
          <p id="terms-text">ここに利用規約のテキストが表示されます。</p>
        </div>

        <div id="edit-section" class="terms-body hidden">
          <textarea id="terms-input" rows="10" placeholder="利用規約を入力してください..."></textarea>
          <div class="action-buttons">
            <button id="save-btn" class="btn btn-success">保存してDiscordへ送信</button>
            <button id="cancel-btn" class="btn btn-secondary">キャンセル</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    const viewSection = document.getElementById('view-section');
    const editSection = document.getElementById('edit-section');
    const termsText = document.getElementById('terms-text');
    const termsInput = document.getElementById('terms-input');

    hamburgerBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    editBtn.addEventListener('click', () => {
      termsInput.value = termsText.innerText;
      viewSection.classList.add('hidden');
      editSection.classList.remove('hidden');
      editBtn.classList.add('hidden');
    });

    cancelBtn.addEventListener('click', () => {
      editSection.classList.add('hidden');
      viewSection.classList.remove('hidden');
      editBtn.classList.remove('hidden');
    });

    // Netlify Function へ送信
    saveBtn.addEventListener('click', async () => {
      const newContent = termsInput.value;

      if (!newContent.trim()) {
        alert("利用規約の内容を入力してください。");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "送信中...";

      try {
        const response = await fetch('/.netlify/functions/update-terms', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ content: newContent })
        });

        if (response.ok) {
          alert("Discordの利用規約を更新しました。");
          termsText.innerText = newContent;

          editSection.classList.add('hidden');
          viewSection.classList.remove('hidden');
          editBtn.classList.remove('hidden');
        } else {
          const errorData = await response.json();
          console.error("Error:", errorData);
          alert("更新に失敗しました。Netlifyの環境変数設定などを確認してください。");
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        alert("通信エラーが発生しました。");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "保存してDiscordへ送信";
      }
    });
  </script>
</body>
</html>
