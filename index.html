<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灘校84回生＋αグループ - 管理サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    .admin-container { display: flex; min-height: 100vh; }
    
    /* 左メニューを画面に固定 (Scrollしても追従) */
    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
    .sidebar ul { list-style: none; }
    .sidebar li a { color: #ecf0f1; text-decoration: none; display: block; padding: 10px; border-radius: 4px; margin-bottom: 5px; }
    .sidebar li a.active, .sidebar li a:hover { background-color: #34495e; }
    
    .hamburger { display: none; position: fixed; top: 15px; left: 15px; z-index: 1000; font-size: 24px; background: #2c3e50; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    .content { flex: 1; padding: 40px; min-width: 0; }
    
    /* 基本カードスタイル */
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="text"], select { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 4px; cursor: pointer; }

    /* --- botの状態 表示用スタイル --- */
    .bot-status-container { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 1rem; color: white; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: white; }
    .status-badge.online { background-color: #2ecc71; box-shadow: 0 0 8px rgba(46, 204, 113, 0.4); }

    /* バージョン入力フォーム */
    .version-input-container { display: flex; align-items: center; font-size: 1.1rem; font-weight: bold; gap: 6px; }
    .version-part-first, .version-part { width: 50px; text-align: center; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }

    /* --- テーブル共有スタイル --- */
    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .data-table th, .data-table td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
    .data-table th { background-color: #f8fafc; font-weight: bold; color: #2c3e50; }
    .data-table tr:nth-child(even) { background-color: #fdfdfd; }

    /* 検索コントロール */
    .search-box { width: 100%; max-width: 300px; padding: 8px 12px; font-size: 0.95rem; }
    .log-filter-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

    /* ボタン・ツールバー */
    .toolbar { display: flex; gap: 5px; margin-bottom: 5px; background: #eef2f5; padding: 6px; border-radius: 4px 4px 0 0; border: 1px solid #ccc; border-bottom: none; }
    .toolbar button { padding: 6px 12px; border: 1px solid #aaa; background: #fff; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .toolbar button.active { background-color: #3498db; color: white; }

    .editor-area { width: 100%; min-height: 200px; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 0 0 4px 4px; background: #fff; overflow-y: auto; line-height: 1.6; white-space: pre-wrap; outline: none; }
    .markdown-body .spoiler { background-color: #4f545c; color: transparent; border-radius: 3px; padding: 0 4px; cursor: pointer; }
    .markdown-body .spoiler.revealed { background-color: #b9bbbe; color: #2e3136; }

    .markdown-body { line-height: 1.6; white-space: pre-wrap; }
    .action-buttons { margin-top: 15px; display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .hidden { display: none; }

    .footer-preview { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 0.85rem; color: #666; }

    /* ログバッジ */
    .log-type-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #e2e8f0; color: #475569; }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 999; transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 60px 20px 20px 20px; }
    }
  </style>
</head>
<body>

  <button class="hamburger" id="hamburger-btn">☰</button>

  <div class="admin-container">
    <nav class="sidebar" id="sidebar">
      <h2>灘校84回生＋α</h2>
      <ul>
        <li><a href="#" id="menu-version">bot設定</a></li>
        <li><a href="#" class="active" id="menu-terms">利用規約</a></li>
        <li><a href="#" id="menu-members">メンバー</a></li>
        <li><a href="#" id="menu-logs">詳細ログ</a></li>
      </ul>
    </nav>

    <main class="content">

      <div id="section-version" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>botの状態</h2>
          </div>
          <div class="bot-status-container">
            <div id="bot-status-badge" class="status-badge online">
              <span class="status-dot"></span>
              <span id="bot-status-text">オンライン</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>バージョン設定</h2>
            <button id="edit-version-btn" class="btn btn-primary">編集</button>
          </div>

          <div id="version-view">
            <p>現在のボットバージョン: <strong id="version-display">1.00.00</strong></p>
          </div>

          <div id="version-edit" class="hidden">
            <div class="form-group">
              <div class="version-input-container">
                <span>N84ボット v</span>
                <input type="text" id="v-major" class="version-part-first" maxlength="3" placeholder="1">
                <span>.</span>
                <input type="text" id="v-minor" class="version-part" maxlength="2" placeholder="00">
                <span>.</span>
                <input type="text" id="v-patch" class="version-part" maxlength="2" placeholder="00">
              </div>
            </div>
            <div class="action-buttons">
              <button id="save-version-btn" class="btn btn-success">保存してDiscordへ反映</button>
              <button class="btn btn-secondary cancel-version-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </div>

      <div id="section-terms">
        <div class="card">
          <div class="card-header">
            <h2>利用規約</h2>
            <button id="edit-terms-btn" class="btn btn-primary">編集</button>
          </div>

          <div id="terms-view">
            <h3 id="terms-title-display" style="margin-bottom: 10px;">📜 利用規約 - 灘校84回生＋αグループ</h3>
            <div id="terms-text-display" class="markdown-body">ここに利用規約のテキストが表示されます。</div>
            <div class="footer-preview">
              フッター: <span id="footer-preview-display">N84ボット v1.00.00</span>
            </div>
          </div>

          <div id="terms-edit" class="hidden">
            <div class="form-group">
              <label for="terms-title-input">タイトル（任意）</label>
              <input type="text" id="terms-title-input" style="width: 100%;" placeholder="タイトルなしにする場合は空欄">
            </div>

            <div class="form-group">
              <label for="terms-color-input">埋め込みカラー (Embed Color)</label>
              <div class="color-picker-wrapper">
                <input type="color" id="terms-color-input" value="#3498db">
                <span id="color-code-text">#3498db</span>
              </div>
            </div>

            <div class="form-group">
              <label>規約本文（必須）</label>
              <div class="toolbar">
                <button type="button" id="btn-bold" title="太字"><b>B</b></button>
                <button type="button" id="btn-italic" title="斜体"><i>I</i></button>
                <button type="button" id="btn-underline" title="下線"><u>U</u></button>
                <button type="button" id="btn-strike" title="打ち消し線"><s>S</s></button>
                <button type="button" id="btn-spoiler" title="ネタバレ防止">|| ネタバレ ||</button>
              </div>
              <div id="editor" class="editor-area" contenteditable="true"></div>
            </div>

            <div class="action-buttons">
              <button id="save-terms-btn" class="btn btn-success">保存してDiscordへ送信</button>
              <button class="btn btn-secondary cancel-terms-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </div>

      <div id="section-members" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>サーバーメンバー対応表（50音順）</h2>
            <div>
              <input type="text" id="member-search-input" class="search-box" placeholder="名前やIDで検索...">
              <button id="refresh-members-btn" class="btn btn-primary btn-sm">再読み込み</button>
            </div>
          </div>

          <div id="members-view">
            <table class="data-table">
              <thead>
                <tr>
                  <th>メンバー名</th>
                  <th>ユーザーID</th>
                </tr>
              </thead>
              <tbody id="members-tbody-view">
                <tr><td colspan="2" style="text-align:center;">読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="section-logs" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>詳細アクティビティログ</h2>
            <button id="refresh-logs-btn" class="btn btn-primary btn-sm">再読み込み</button>
          </div>

          <div class="log-filter-container">
            <select id="log-type-filter">
              <option value="ALL">全てのイベント</option>
              <optgroup label="メッセージ・アクティビティ">
                <option value="メッセージ送信">メッセージ送信</option>
                <option value="メッセージ編集">メッセージ編集</option>
                <option value="メッセージ削除">メッセージ削除</option>
                <option value="リアクション追加">リアクション追加</option>
                <option value="リアクション削除">リアクション削除</option>
              </optgroup>
              <optgroup label="監査ログ（サーバー・管理）">
                <option value="サーバー更新">サーバー更新</option>
                <option value="地域更新">地域更新</option>
                <option value="チャンネル作成">チャンネル作成</option>
                <option value="チャンネル更新">チャンネル更新</option>
                <option value="チャンネル削除">チャンネル削除</option>
                <option value="チャンネル権限上書き作成">チャンネル権限上書き作成</option>
                <option value="チャンネル権限上書き更新">チャンネル権限上書き更新</option>
                <option value="チャンネル権限上書き削除">チャンネル権限上書き削除</option>
                <option value="メンバーキック">メンバーキック</option>
                <option value="メンバー警告">メンバー警告</option>
                <option value="メンバーBAN追加">メンバーBAN追加</option>
                <option value="メンバーBAN削除">メンバーBAN削除</option>
                <option value="メンバー更新">メンバー更新</option>
                <option value="メンバー移動">メンバー移動</option>
                <option value="メンバー切断">メンバー切断</option>
                <option value="ロール作成">ロール作成</option>
                <option value="ロール更新">ロール更新</option>
                <option value="ロール削除">ロール削除</option>
                <option value="招待作成">招待作成</option>
                <option value="招待削除">招待削除</option>
                <option value="絵文字作成">絵文字作成</option>
                <option value="絵文字更新">絵文字更新</option>
                <option value="絵文字削除">絵文字削除</option>
                <option value="スタンプ作成">スタンプ作成</option>
                <option value="スタンプ更新">スタンプ更新</option>
                <option value="スタンプ削除">スタンプ削除</option>
                <option value="サウンド作成">サウンド作成</option>
                <option value="サウンド更新">サウンド更新</option>
                <option value="サウンド削除">サウンド削除</option>
                <option value="Webhook作成">Webhook作成</option>
                <option value="Webhook更新">Webhook更新</option>
                <option value="Webhook削除">Webhook削除</option>
                <option value="スレッド作成">スレッド作成</option>
                <option value="スレッド更新">スレッド更新</option>
                <option value="スレッド削除">スレッド削除</option>
                <option value="アプリケーションコマンド権限更新">アプリケーションコマンド権限更新</option>
                <option value="統合作成">統合作成</option>
                <option value="統合更新">統合更新</option>
                <option value="統合削除">統合削除</option>
                <option value="自動モデレーションルール作成">自動モデレーションルール作成</option>
                <option value="自動モデレーションルール更新">自動モデレーションルール更新</option>
                <option value="自動モデレーションルール削除">自動モデレーションルール削除</option>
                <option value="自動モデレーションによるブロック">自動モデレーションによるブロック</option>
              </optgroup>
            </select>
            <input type="text" id="log-search-input" class="search-box" placeholder="キーワード検索...">
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 160px;">日時</th>
                <th style="width: 160px;">イベントタイプ</th>
                <th style="width: 150px;">実行者 / ユーザー</th>
                <th>詳細情報</th>
              </tr>
            </thead>
            <tbody id="logs-tbody-view">
              <tr><td colspan="4" style="text-align:center;">ログを読み込み中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    let currentVersion = localStorage.getItem('n84_version') || "1.00.00";
    let currentTitle = localStorage.getItem('n84_title') ?? "📜 利用規約 - 灘校84回生＋αグループ";
    let currentMarkdownContent = localStorage.getItem('n84_content') || "ここに **利用規約** のテキストが表示されます。";
    let currentColor = localStorage.getItem('n84_color') || "#3498db";

    let fetchedMembersData = [];
    let fetchedLogsData = [];

    function saveToLocalStorage() {
      localStorage.setItem('n84_version', currentVersion);
      localStorage.setItem('n84_title', currentTitle);
      localStorage.setItem('n84_content', currentMarkdownContent);
      localStorage.setItem('n84_color', currentColor);
    }

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const menuVersion = document.getElementById('menu-version');
    const menuTerms = document.getElementById('menu-terms');
    const menuMembers = document.getElementById('menu-members');
    const menuLogs = document.getElementById('menu-logs');
    
    const editVersionBtn = document.getElementById('edit-version-btn');
    const editTermsBtn = document.getElementById('edit-terms-btn');
    const refreshMembersBtn = document.getElementById('refresh-members-btn');
    const refreshLogsBtn = document.getElementById('refresh-logs-btn');
    const memberSearchInput = document.getElementById('member-search-input');
    const logSearchInput = document.getElementById('log-search-input');
    const logTypeFilter = document.getElementById('log-type-filter');

    const sectionVersion = document.getElementById('section-version');
    const versionView = document.getElementById('version-view');
    const versionEdit = document.getElementById('version-edit');
    const versionDisplay = document.getElementById('version-display');
    const vMajor = document.getElementById('v-major');
    const vMinor = document.getElementById('v-minor');
    const vPatch = document.getElementById('v-patch');
    const saveVersionBtn = document.getElementById('save-version-btn');

    const sectionTerms = document.getElementById('section-terms');
    const termsView = document.getElementById('terms-view');
    const termsEdit = document.getElementById('terms-edit');
    const termsTitleDisplay = document.getElementById('terms-title-display');
    const termsTextDisplay = document.getElementById('terms-text-display');
    const footerPreviewDisplay = document.getElementById('footer-preview-display');
    
    const termsTitleInput = document.getElementById('terms-title-input');
    const termsColorInput = document.getElementById('terms-color-input');
    const colorCodeText = document.getElementById('color-code-text');
    const editor = document.getElementById('editor');
    const saveTermsBtn = document.getElementById('save-terms-btn');

    const sectionMembers = document.getElementById('section-members');
    const membersTbodyView = document.getElementById('members-tbody-view');

    const sectionLogs = document.getElementById('section-logs');
    const logsTbodyView = document.getElementById('logs-tbody-view');

    const btnBold = document.getElementById('btn-bold');
    const btnItalic = document.getElementById('btn-italic');
    const btnUnderline = document.getElementById('btn-underline');
    const btnStrike = document.getElementById('btn-strike');
    const btnSpoiler = document.getElementById('btn-spoiler');

    const cancelVersionBtn = document.querySelector('.cancel-version-btn');
    const cancelTermsBtn = document.querySelector('.cancel-terms-btn');

    /* --- メンバー一覧取得 & 検索処理 --- */
    async function fetchAndRenderMembers() {
      membersTbodyView.innerHTML = `<tr><td colspan="2" style="text-align:center;">メンバー情報をDiscordから取得中...</td></tr>`;

      try {
        const res = await fetch('/.netlify/functions/get-members');
        if (!res.ok) throw new Error('取得エラー');

        fetchedMembersData = await res.json();
        renderFilteredMembers();

      } catch (err) {
        console.error(err);
        membersTbodyView.innerHTML = `<tr><td colspan="2" style="text-align:center; color: red;">メンバー一覧の取得に失敗しました。</td></tr>`;
      }
    }

    function renderFilteredMembers() {
      const query = memberSearchInput.value.toLowerCase().trim();
      const filtered = fetchedMembersData.filter(m => 
        m.name.toLowerCase().includes(query) || m.id.includes(query)
      );

      if (filtered.length === 0) {
        membersTbodyView.innerHTML = `<tr><td colspan="2" style="text-align:center;">該当するメンバーが見つかりませんでした。</td></tr>`;
        return;
      }

      membersTbodyView.innerHTML = filtered.map(m => `
        <tr>
          <td>${escapeHtml(m.name)}</td>
          <td><code>${escapeHtml(m.id)}</code></td>
        </tr>
      `).join('');
    }

    memberSearchInput.addEventListener('input', renderFilteredMembers);
    refreshMembersBtn.addEventListener('click', fetchAndRenderMembers);

    /* --- 詳細ログ取得 & フィルタリング処理 --- */
    async function fetchAndRenderLogs() {
      logsTbodyView.innerHTML = `<tr><td colspan="4" style="text-align:center;">ログをロード中...</td></tr>`;

      try {
        const res = await fetch('/.netlify/functions/get-logs');
        if (!res.ok) throw new Error('取得エラー');

        fetchedLogsData = await res.json();
        renderFilteredLogs();

      } catch (err) {
        // エラー時のフォールバックダミーログ構造
        fetchedLogsData = [
          { time: "2026-07-25 19:30:12", type: "メッセージ送信", user: "山田太郎", details: "#雑談 - 「こんにちは！」" },
          { time: "2026-07-25 19:28:05", type: "リアクション追加", user: "佐藤花子", details: "#雑談 - 👍 を追加" },
          { time: "2026-07-25 18:40:00", type: "メンバー更新", user: "管理者Bot", details: "ユーザーニックネームを変更" }
        ];
        renderFilteredLogs();
      }
    }

    function renderFilteredLogs() {
      const typeFilter = logTypeFilter.value;
      const query = logSearchInput.value.toLowerCase().trim();

      const filtered = fetchedLogsData.filter(log => {
        const matchType = (typeFilter === "ALL") || (log.type === typeFilter);
        const matchQuery = log.user.toLowerCase().includes(query) || 
                           log.details.toLowerCase().includes(query) ||
                           log.type.toLowerCase().includes(query);
        return matchType && matchQuery;
      });

      if (filtered.length === 0) {
        logsTbodyView.innerHTML = `<tr><td colspan="4" style="text-align:center;">該当するログデータが存在しません。</td></tr>`;
        return;
      }

      logsTbodyView.innerHTML = filtered.map(log => `
        <tr>
          <td style="font-size:0.85rem; color:#666;">${escapeHtml(log.time)}</td>
          <td><span class="log-type-tag">${escapeHtml(log.type)}</span></td>
          <td><b>${escapeHtml(log.user)}</b></td>
          <td style="font-size:0.9rem;">${escapeHtml(log.details)}</td>
        </tr>
      `).join('');
    }

    logTypeFilter.addEventListener('change', renderFilteredLogs);
    logSearchInput.addEventListener('input', renderFilteredLogs);
    refreshLogsBtn.addEventListener('click', fetchAndRenderLogs);

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : "";
    }

    /* --- リッチテキスト・マークダウン関連 --- */
    function formatDoc(cmd) {
      document.execCommand(cmd, false, null);
      checkActiveStyles();
      editor.focus();
    }

    function applySpoiler() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const span = document.createElement("span");
      span.className = "spoiler";
      span.appendChild(range.extractContents());
      range.insertNode(span);
      checkActiveStyles();
      editor.focus();
    }

    btnBold.addEventListener('click', () => formatDoc('bold'));
    btnItalic.addEventListener('click', () => formatDoc('italic'));
    btnUnderline.addEventListener('click', () => formatDoc('underline'));
    btnStrike.addEventListener('click', () => formatDoc('strikeThrough'));
    btnSpoiler.addEventListener('click', () => applySpoiler());

    function checkActiveStyles() {
      btnBold.classList.toggle('active', document.queryCommandState('bold'));
      btnItalic.classList.toggle('active', document.queryCommandState('italic'));
      btnUnderline.classList.toggle('active', document.queryCommandState('underline'));
      btnStrike.classList.toggle('active', document.queryCommandState('strikeThrough'));
    }

    function markdownToHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.add(\'revealed\')">$1</span>')
        .replace(/__(.*?)__/g, '<u>$1</u>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/~~(.*?)~~/g, '<s>$1</s>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/\n/g, '<br>');
    }

    function htmlToMarkdown(node) {
      let md = "";
      for (let child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) {
          md += child.textContent;
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName.toLowerCase();
          let inner = htmlToMarkdown(child);
          if (child.classList.contains("spoiler")) md += `||${inner}||`;
          else if (tag === "b" || tag === "strong") md += `**${inner}**`;
          else if (tag === "i" || tag === "em") md += `*${inner}*`;
          else if (tag === "u") md += `__${inner}__`;
          else if (tag === "s" || tag === "strike") md += `~~${inner}~~`;
          else if (tag === "br") md += "\n";
          else if (tag === "div" || tag === "p") md += "\n" + inner;
          else md += inner;
        }
      }
      return md;
    }

    function renderView() {
      if (currentTitle.trim()) {
        termsTitleDisplay.innerText = currentTitle;
        termsTitleDisplay.style.display = "block";
      } else {
        termsTitleDisplay.style.display = "none";
      }
      termsTextDisplay.innerHTML = markdownToHtml(currentMarkdownContent);
      versionDisplay.innerText = currentVersion;
      footerPreviewDisplay.innerText = `N84ボット v${currentVersion}`;
    }
    renderView();

    termsColorInput.addEventListener('input', (e) => {
      colorCodeText.innerText = e.target.value;
    });

    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

    /* --- タブ切り替え --- */
    function switchTab(tab) {
      exitEditMode();

      menuVersion.classList.remove('active');
      menuTerms.classList.remove('active');
      menuMembers.classList.remove('active');
      menuLogs.classList.remove('active');

      sectionVersion.classList.add('hidden');
      sectionTerms.classList.add('hidden');
      sectionMembers.classList.add('hidden');
      sectionLogs.classList.add('hidden');

      if (tab === 'version') {
        menuVersion.classList.add('active');
        sectionVersion.classList.remove('hidden');
      } else if (tab === 'terms') {
        menuTerms.classList.add('active');
        sectionTerms.classList.remove('hidden');
      } else if (tab === 'members') {
        menuMembers.classList.add('active');
        sectionMembers.classList.remove('hidden');
        fetchAndRenderMembers();
      } else if (tab === 'logs') {
        menuLogs.classList.add('active');
        sectionLogs.classList.remove('hidden');
        fetchAndRenderLogs();
      }
    }

    menuVersion.addEventListener('click', (e) => { e.preventDefault(); switchTab('version'); });
    menuTerms.addEventListener('click', (e) => { e.preventDefault(); switchTab('terms'); });
    menuMembers.addEventListener('click', (e) => { e.preventDefault(); switchTab('members'); });
    menuLogs.addEventListener('click', (e) => { e.preventDefault(); switchTab('logs'); });

    /* --- 編集モード切り替え --- */
    editVersionBtn.addEventListener('click', () => {
      editVersionBtn.classList.add('hidden');
      const parts = currentVersion.split('.');
      vMajor.value = parts[0] || '';
      vMinor.value = parts[1] || '';
      vPatch.value = parts[2] || '';
      versionView.classList.add('hidden');
      versionEdit.classList.remove('hidden');
    });

    editTermsBtn.addEventListener('click', () => {
      editTermsBtn.classList.add('hidden');
      termsTitleInput.value = currentTitle;
      termsColorInput.value = currentColor;
      colorCodeText.innerText = currentColor;
      editor.innerHTML = markdownToHtml(currentMarkdownContent);
      termsView.classList.add('hidden');
      termsEdit.classList.remove('hidden');
    });

    function exitEditMode() {
      editVersionBtn.classList.remove('hidden');
      editTermsBtn.classList.remove('hidden');
      versionView.classList.remove('hidden');
      versionEdit.classList.add('hidden');
      termsView.classList.remove('hidden');
      termsEdit.classList.add('hidden');
    }

    cancelVersionBtn.addEventListener('click', exitEditMode);
    cancelTermsBtn.addEventListener('click', exitEditMode);

    async function sendUpdateToDiscord(payload) {
      return await fetch('/.netlify/functions/update-terms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    saveTermsBtn.addEventListener('click', async () => {
      const newTitle = termsTitleInput.value.trim();
      const newColor = termsColorInput.value;
      const newMarkdownContent = htmlToMarkdown(editor).trim();

      if (!newMarkdownContent) {
        alert("利用規約の本文は必須です。");
        return;
      }

      saveTermsBtn.disabled = true;

      try {
        const res = await sendUpdateToDiscord({
          title: newTitle,
          content: newMarkdownContent,
          color: newColor,
          version: currentVersion
        });

        if (res.ok) {
          currentTitle = newTitle;
          currentColor = newColor;
          currentMarkdownContent = newMarkdownContent;
          saveToLocalStorage();
          renderView();
          alert("利用規約を更新しました。");
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        alert("通信エラーが発生しました。");
      } finally {
        saveTermsBtn.disabled = false;
      }
    });

    saveVersionBtn.addEventListener('click', async () => {
      const maj = vMajor.value.trim();
      const min = vMinor.value.trim();
      const pat = vPatch.value.trim();

      if (maj === '' || min === '' || pat === '') {
        alert("バージョンの枠をすべて入力してください。");
        return;
      }

      const newVersion = `${maj}.${min}.${pat}`;
      saveVersionBtn.disabled = true;

      try {
        const res = await sendUpdateToDiscord({
          title: currentTitle,
          content: currentMarkdownContent,
          color: currentColor,
          version: newVersion
        });

        if (res.ok) {
          currentVersion = newVersion;
          saveToLocalStorage();
          renderView();
          alert(`バージョンを v${currentVersion} に更新しました。`);
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        alert("通信エラーが発生しました。");
      } finally {
        saveVersionBtn.disabled = false;
      }
    });
  </script>
</body>
