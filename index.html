<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灘校84回生＋αグループ - 管理サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    .admin-container { display: flex; min-height: 100vh; }
    
    .sidebar { width: 250px; background-color: #2c3e50; color: #fff; padding: 20px; transition: transform 0.3s ease; }
    .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
    .sidebar ul { list-style: none; }
    .sidebar li a { color: #ecf0f1; text-decoration: none; display: block; padding: 10px; border-radius: 4px; margin-bottom: 5px; }
    .sidebar li a.active, .sidebar li a:hover { background-color: #34495e; }
    
    .hamburger { display: none; position: fixed; top: 15px; left: 15px; z-index: 1000; font-size: 24px; background: #2c3e50; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    .content { flex: 1; padding: 40px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
    input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 4px; cursor: pointer; }
    
    .version-input-container { display: flex; align-items: center; font-size: 1.1rem; font-weight: bold; gap: 5px; }
    .version-input-container input { width: 150px; text-align: center; }

    /* マークダウンツールバー */
    .toolbar { display: flex; gap: 5px; margin-bottom: 5px; background: #eef2f5; padding: 5px; border-radius: 4px 4px 0 0; border: 1px solid #ccc; border-bottom: none; }
    .toolbar button { padding: 4px 10px; border: 1px solid #aaa; background: #fff; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .toolbar button:hover { background: #e2e8f0; }
    .markdown-textarea { border-radius: 0 0 4px 4px !important; }

    /* Discord風マークダウンプレビュー装飾 */
    .markdown-body { line-height: 1.6; white-space: pre-wrap; }
    .markdown-body strong { font-weight: bold; }
    .markdown-body em { font-style: italic; }
    .markdown-body u { text-decoration: underline; }
    .markdown-body s { text-decoration: line-through; }
    .markdown-body .spoiler { background-color: #2a2b2e; color: transparent; border-radius: 3px; padding: 0 2px; cursor: pointer; }
    .markdown-body .spoiler:hover { color: #fff; }

    .action-buttons { margin-top: 15px; display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .hidden { display: none; }

    .footer-preview { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 0.85rem; color: #666; }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 999; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 60px 20px 20px 20px; }
    }
  </style>
</head>
<body>

  <button class="hamburger" id="hamburger-btn">☰</button>

  <div class="admin-container">
    <nav class="sidebar" id="sidebar">
      <h2>灘校84回生＋α</h2>
      <ul>
        <li><a href="#" id="menu-version">バージョン</a></li>
        <li><a href="#" class="active" id="menu-terms">利用規約</a></li>
      </ul>
    </nav>

    <main class="content">
      <div class="card">
        <div class="card-header">
          <h2 id="page-title">利用規約</h2>
          <button id="edit-btn" class="btn btn-primary">編集</button>
        </div>

        <div id="section-version" class="hidden">
          <div id="version-view">
            <p>現在のボットバージョン: <strong id="version-display">1.00.00</strong></p>
          </div>
          <div id="version-edit" class="hidden">
            <div class="form-group">
              <label>ボットバージョン設定</label>
              <div class="version-input-container">
                <span>N84ボット v</span>
                <input type="text" id="version-input" placeholder="1.00.00">
              </div>
            </div>
            <div class="action-buttons">
              <button id="save-version-btn" class="btn btn-success">保存してDiscordへ反映</button>
              <button class="btn btn-secondary cancel-btn">キャンセル</button>
            </div>
          </div>
        </div>

        <div id="section-terms">
          <div id="terms-view">
            <h3 id="terms-title-display" style="margin-bottom: 10px;">📜 利用規約 - 灘校84回生＋αグループ</h3>
            <div id="terms-text-display" class="markdown-body">ここに利用規約のテキストが表示されます。</div>
            <div class="footer-preview">
              フッター: <span id="footer-preview-display">N84ボット v1.00.00</span>
            </div>
          </div>

          <div id="terms-edit" class="hidden">
            <div class="form-group">
              <label for="terms-title-input">タイトル</label>
              <input type="text" id="terms-title-input" value="📜 利用規約 - 灘校84回生＋αグループ">
            </div>

            <div class="form-group">
              <label for="terms-color-input">埋め込みカラー (Embed Color)</label>
              <div class="color-picker-wrapper">
                <input type="color" id="terms-color-input" value="#3498db">
                <span id="color-code-text">#3498db</span>
              </div>
            </div>

            <div class="form-group">
              <label>規約本文</label>
              <div class="toolbar">
                <button type="button" onclick="insertMarkdown('**', '**')" title="太字"><b>B</b></button>
                <button type="button" onclick="insertMarkdown('*', '*')" title="斜体"><i>I</i></button>
                <button type="button" onclick="insertMarkdown('__', '__')" title="下線"><u>U</u></button>
                <button type="button" onclick="insertMarkdown('~~', '~~')" title="打ち消し線"><s>S</s></button>
                <button type="button" onclick="insertMarkdown('||', '||')" title="ネタバレ防止">|| ネタバレ ||</button>
              </div>
              <textarea id="terms-content-input" class="markdown-textarea" rows="10" placeholder="利用規約を入力してください..."></textarea>
            </div>

            <div class="action-buttons">
              <button id="save-terms-btn" class="btn btn-success">保存してDiscordへ送信</button>
              <button class="btn btn-secondary cancel-btn">キャンセル</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    let currentVersion = "1.00.00";
    let currentTitle = "📜 利用規約 - 灘校84回生＋αグループ";
    let currentContent = "ここに **利用規約** のテキストが表示されます。\n||ネタバレ文字|| や __下線__ もサポートされています。";
    let currentColor = "#3498db";
    let currentTab = "terms";

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    const menuVersion = document.getElementById('menu-version');
    const menuTerms = document.getElementById('menu-terms');
    
    const pageTitle = document.getElementById('page-title');
    const editBtn = document.getElementById('edit-btn');
    
    const sectionVersion = document.getElementById('section-version');
    const versionView = document.getElementById('version-view');
    const versionEdit = document.getElementById('version-edit');
    const versionDisplay = document.getElementById('version-display');
    const versionInput = document.getElementById('version-input');
    const saveVersionBtn = document.getElementById('save-version-btn');

    const sectionTerms = document.getElementById('section-terms');
    const termsView = document.getElementById('terms-view');
    const termsEdit = document.getElementById('terms-edit');
    const termsTitleDisplay = document.getElementById('terms-title-display');
    const termsTextDisplay = document.getElementById('terms-text-display');
    const footerPreviewDisplay = document.getElementById('footer-preview-display');
    
    const termsTitleInput = document.getElementById('terms-title-input');
    const termsColorInput = document.getElementById('terms-color-input');
    const colorCodeText = document.getElementById('color-code-text');
    const termsContentInput = document.getElementById('terms-content-input');
    const saveTermsBtn = document.getElementById('save-terms-btn');
    
    const cancelBtns = document.querySelectorAll('.cancel-btn');

    // マークダウン挿入処理（ボタン押下時）
    function insertMarkdown(startTag, endTag) {
      const textarea = termsContentInput;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end);
      const replacement = startTag + selectedText + endTag;

      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + startTag.length, end + startTag.length);
    }

    // 簡易マークダウン変換 (Discord互換)
    function parseDiscordMarkdown(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") // エスケープ
        .replace(/\|\|(.*?)\|\|/g, '<span class="spoiler">$1</span>')       // ネタバレ
        .replace(/__(.*?)__/g, '<u>$1</u>')                                 // 下線
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')                   // 太字
        .replace(/~~(.*?)~~/g, '<s>$1</s>')                                 // 打ち消し
        .replace(/\*(.*?)\*/g, '<em>$1</em>');                              // 斜体
    }

    // 初期状態の画面描画
    termsTextDisplay.innerHTML = parseDiscordMarkdown(currentContent);

    termsColorInput.addEventListener('input', (e) => {
      colorCodeText.innerText = e.target.value;
    });

    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

    function switchTab(tab) {
      currentTab = tab;
      exitEditMode();

      if (tab === 'version') {
        menuVersion.classList.add('active');
        menuTerms.classList.remove('active');
        sectionVersion.classList.remove('hidden');
        sectionTerms.classList.add('hidden');
        pageTitle.innerText = "バージョン管理";
      } else {
        menuTerms.classList.add('active');
        menuVersion.classList.remove('active');
        sectionTerms.classList.remove('hidden');
        sectionVersion.classList.add('hidden');
        pageTitle.innerText = "利用規約";
      }
    }

    menuVersion.addEventListener('click', (e) => { e.preventDefault(); switchTab('version'); });
    menuTerms.addEventListener('click', (e) => { e.preventDefault(); switchTab('terms'); });

    editBtn.addEventListener('click', () => {
      editBtn.classList.add('hidden');

      if (currentTab === 'version') {
        versionInput.value = currentVersion;
        versionView.classList.add('hidden');
        versionEdit.classList.remove('hidden');
      } else {
        termsTitleInput.value = currentTitle;
        termsColorInput.value = currentColor;
        colorCodeText.innerText = currentColor;
        termsContentInput.value = currentContent;
        termsView.classList.add('hidden');
        termsEdit.classList.remove('hidden');
      }
    });

    function exitEditMode() {
      editBtn.classList.remove('hidden');
      versionView.classList.remove('hidden');
      versionEdit.classList.add('hidden');
      termsView.classList.remove('hidden');
      termsEdit.classList.add('hidden');
    }

    cancelBtns.forEach(btn => btn.addEventListener('click', exitEditMode));

    async function sendUpdateToDiscord(payload) {
      return await fetch('/.netlify/functions/update-terms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    saveTermsBtn.addEventListener('click', async () => {
      const newTitle = termsTitleInput.value.trim();
      const newColor = termsColorInput.value;
      const newContent = termsContentInput.value.trim();

      if (!newTitle || !newContent) {
        alert("タイトルと本文を入力してください。");
        return;
      }

      saveTermsBtn.disabled = true;
      saveTermsBtn.innerText = "送信中...";

      try {
        const res = await sendUpdateToDiscord({
          title: newTitle,
          content: newContent,
          color: newColor,
          version: currentVersion
        });

        if (res.ok) {
          currentTitle = newTitle;
          currentColor = newColor;
          currentContent = newContent;

          termsTitleDisplay.innerText = currentTitle;
          termsTextDisplay.innerHTML = parseDiscordMarkdown(currentContent);
          
          alert("利用規約を更新しました。");
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        console.error(err);
        alert("通信エラーが発生しました。");
      } finally {
        saveTermsBtn.disabled = false;
        saveTermsBtn.innerText = "保存してDiscordへ送信";
      }
    });

    saveVersionBtn.addEventListener('click', async () => {
      const newVersion = versionInput.value.trim();

      if (!newVersion) {
        alert("バージョンを入力してください。");
        return;
      }

      saveVersionBtn.disabled = true;
      saveVersionBtn.innerText = "送信中...";

      try {
        const res = await sendUpdateToDiscord({
          title: currentTitle,
          content: currentContent,
          color: currentColor,
          version: newVersion
        });

        if (res.ok) {
          currentVersion = newVersion;
          versionDisplay.innerText = currentVersion;
          footerPreviewDisplay.innerText = `N84ボット v${currentVersion}`;
          
          alert(`バージョンを v${currentVersion} に更新しました。`);
          exitEditMode();
        } else {
          alert("Discordの更新に失敗しました。");
        }
      } catch (err) {
        console.error(err);
        alert("通信エラーが発生しました。");
      } finally {
        saveVersionBtn.disabled = false;
        saveVersionBtn.innerText = "保存してDiscordへ反映";
      }
    });
  </script>
</body>
</html>
