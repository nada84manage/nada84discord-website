<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灘校84回生＋αグループ - 管理サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    .admin-container { display: flex; min-height: 100vh; }
    
    /* 左メニュー固定 */
    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: #fff;
      padding: 15px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar h2 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #34495e; padding-bottom: 8px; }
    .sidebar ul { list-style: none; }
    .sidebar li a { color: #ecf0f1; text-decoration: none; display: block; padding: 8px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 0.9rem; }
    .sidebar li a.active, .sidebar li a:hover { background-color: #34495e; font-weight: bold; }
    
    .hamburger { display: none; position: fixed; top: 10px; left: 10px; z-index: 1000; font-size: 20px; background: #2c3e50; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    .content { flex: 1; padding: 25px; min-width: 0; }
    
    /* カード */
    .card { background: white; padding: 15px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .card-header h2 { font-size: 1.1rem; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; }
    input[type="text"], select { padding: 6px 10px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 8px; }
    input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 4px; cursor: pointer; }

    /* bot状態 */
    .bot-status-container { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; color: white; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: white; }
    .status-badge.online { background-color: #2ecc71; }

    /* バージョン設定 */
    .version-input-container { display: flex; align-items: center; font-size: 0.95rem; font-weight: bold; gap: 4px; }
    .version-part-first, .version-part { width: 45px; text-align: center; padding: 4px 6px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px; }

    /* ボタン・ツールバー */
    .toolbar { display: flex; gap: 4px; margin-bottom: 4px; background: #eef2f5; padding: 4px; border-radius: 4px 4px 0 0; border: 1px solid #ccc; border-bottom: none; }
    .toolbar button { padding: 4px 8px; border: 1px solid #aaa; background: #fff; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
    .toolbar button.active { background-color: #3498db; color: white; }

    .editor-area { width: 100%; min-height: 150px; padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 0 0 4px 4px; background: #fff; line-height: 1.5; white-space: pre-wrap; outline: none; }
    .markdown-body .spoiler { background-color: #4f545c; color: transparent; border-radius: 3px; padding: 0 3px; cursor: pointer; }
    .markdown-body .spoiler.revealed { background-color: #b9bbbe; color: #2e3136; }
    .markdown-body { line-height: 1.5; white-space: pre-wrap; font-size: 0.9rem; }

    .action-buttons { margin-top: 10px; display: flex; gap: 8px; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-success { background-color: #2ecc71; color: white; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }
    .hidden { display: none !important; }

    .footer-preview { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 0.8rem; color: #666; }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 999; transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 50px 15px 15px 15px; }
    }
  </style>
</head>
<body>

  <button class="hamburger" id="hamburger-btn">☰</button>

  <div class="admin-container">
    <nav class="sidebar" id="sidebar">
      <h2>灘校84回生＋α</h2>
      <ul>
        <li><a href="#" id="menu-version">bot設定</a></li>
        <li><a href="#" class="active" id="menu-terms">利用規約</a></li>
      </ul>
    </nav>

    <main class="content">

      <div id="section-version" class="hidden">
        <div class="card">
          <div class="card-header">
            <h2>botの状態</h2>
          </div>
          <div class="bot-status-container">
            <div class="status-badge online">
              <span class="status-dot"></span>
              <span>オンライン</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>バージョン設定</h2>
            <button id="edit-version-btn" class="btn btn-primary btn-sm">編集</button>
          </div>

          <div id="version-view">
            <p style="font-size:0.9rem;">現在のボットバージョン: <strong id="version-display">2.00.00</strong></p>
          </div>

          <div id="version-edit" class="hidden">
            <div class="form-group">
              <div class="version-input-container">
                <span>N84ボット v</span>
                <input type="text" id="v-major" class="version-part-first" maxlength="3" placeholder="2">
                <span>.</span>
                <input type="text" id="v-minor" class="version-part" maxlength="2" placeholder="00">
                <span>.</span>
                <input type="text" id="v-patch" class="version-part" maxlength="2" placeholder="00">
              </div>
            </div>
            <div class="action-buttons">
              <button id="save-version-btn" class="btn btn-success btn-sm">保存してDiscordへ反映</button>
              <button class="btn btn-secondary btn-sm cancel-version-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </div>

      <div id="section-terms">
        <div class="card">
          <div class="card-header">
            <h2>利用規約</h2>
            <button id="edit-terms-btn" class="btn btn-primary btn-sm">編集</button>
          </div>

          <div id="terms-view">
            <h3 id="terms-title-display" style="margin-bottom: 8px; font-size:1rem;">📜 利用規約 - 灘校84回生＋αグループ</h3>
            <div id="terms-text-display" class="markdown-body">ここに利用規約のテキストが表示されます。</div>
            <div class="footer-preview">
              フッター: <span id="footer-preview-display">N84ボット v2.00.00</span>
            </div>
          </div>

          <div id="terms-edit" class="hidden">
            <div class="form-group">
              <label for="terms-title-input">タイトル（任意）</label>
              <input type="text" id="terms-title-input" style="width: 100%;" placeholder="タイトルなしにする場合は空欄">
            </div>

            <div class="form-group">
              <label for="terms-color-input">埋め込みカラー</label>
              <div class="color-picker-wrapper">
                <input type="color" id="terms-color-input" value="#3498db">
                <span id="color-code-text" style="font-size:0.85rem;">#3498db</span>
              </div>
            </div>

            <div class="form-group">
              <label>規約本文（必須）</label>
              <div class="toolbar">
                <button type="button" id="btn-bold"><b>B</b></button>
                <button type="button" id="btn-italic"><i>I</i></button>
                <button type="button" id="btn-underline"><u>U</u></button>
                <button type="button" id="btn-strike"><s>S</s></button>
                <button type="button" id="btn-spoiler">|| ネタバレ ||</button>
              </div>
              <div id="editor" class="editor-area" contenteditable="true"></div>
            </div>

            <div class="action-buttons">
              <button id="save-terms-btn" class="btn btn-success btn-sm">保存してDiscordへ送信</button>
              <button class="btn btn-secondary btn-sm cancel-terms-btn">キャンセル</button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    const RENDER_API_URL = "https://nada84discord.onrender.com";

    let currentVersion = localStorage.getItem('n84_version') || "2.00.00";
    let currentTitle = localStorage.getItem('n84_title') ?? "📜 利用規約 - 灘校84回生＋αグループ";
    let currentMarkdownContent = localStorage.getItem('n84_content') || "ここに **利用規約** のテキストが表示されます。";
    let currentColor = localStorage.getItem('n84_color') || "#3498db";

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const sidebar = document.getElementById('sidebar');
    
    const menuVersion = document.getElementById('menu-version');
    const menuTerms = document.getElementById('menu-terms');

    const sectionVersion = document.getElementById('section-version');
    const sectionTerms = document.getElementById('section-terms');

    const editVersionBtn = document.getElementById('edit-version-btn');
    const editTermsBtn = document.getElementById('edit-terms-btn');

    const versionView = document.getElementById('version-view');
    const versionEdit = document.getElementById('version-edit');
    const versionDisplay = document.getElementById('version-display');
    const vMajor = document.getElementById('v-major');
    const vMinor = document.getElementById('v-minor');
    const vPatch = document.getElementById('v-patch');

    const termsView = document.getElementById('terms-view');
    const termsEdit = document.getElementById('terms-edit');
    const termsTitleDisplay = document.getElementById('terms-title-display');
    const termsTextDisplay = document.getElementById('terms-text-display');
    const footerPreviewDisplay = document.getElementById('footer-preview-display');
    
    const termsTitleInput = document.getElementById('terms-title-input');
    const termsColorInput = document.getElementById('terms-color-input');
    const colorCodeText = document.getElementById('color-code-text');
    const editor = document.getElementById('editor');

    const btnBold = document.getElementById('btn-bold');
    const btnItalic = document.getElementById('btn-italic');
    const btnUnderline = document.getElementById('btn-underline');
    const btnStrike = document.getElementById('btn-strike');
    const btnSpoiler = document.getElementById('btn-spoiler');

    const cancelVersionBtn = document.querySelector('.cancel-version-btn');
    const cancelTermsBtn = document.querySelector('.cancel-terms-btn');

    /* --- テキスト装飾 --- */
    function formatDoc(cmd) {
      document.execCommand(cmd, false, null);
      editor.focus();
    }

    function applySpoiler() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return;
      const range = selection.getRangeAt(0);
      const span = document.createElement("span");
      span.className = "spoiler";
      span.appendChild(range.extractContents());
      range.insertNode(span);
      editor.focus();
    }

    btnBold.addEventListener('click', () => formatDoc('bold'));
    btnItalic.addEventListener('click', () => formatDoc('italic'));
    btnUnderline.addEventListener('click', () => formatDoc('underline'));
    btnStrike.addEventListener('click', () => formatDoc('strikeThrough'));
    btnSpoiler.addEventListener('click', () => applySpoiler());

    function markdownToHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.add(\'revealed\')">$1</span>')
        .replace(/__(.*?)__/g, '<u>$1</u>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/~~(.*?)~~/g, '<s>$1</s>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/\n/g, '<br>');
    }

    function renderView() {
      termsTitleDisplay.innerText = currentTitle || "";
      termsTitleDisplay.style.display = currentTitle.trim() ? "block" : "none";
      termsTextDisplay.innerHTML = markdownToHtml(currentMarkdownContent);
      versionDisplay.innerText = currentVersion;
      footerPreviewDisplay.innerText = `N84ボット v${currentVersion}`;
    }
    renderView();

    termsColorInput.addEventListener('input', (e) => colorCodeText.innerText = e.target.value);
    hamburgerBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

    /* --- タブ切り替え --- */
    function switchTab(tab) {
      exitEditMode();

      [menuVersion, menuTerms].forEach(m => m.classList.remove('active'));
      [sectionVersion, sectionTerms].forEach(s => s.classList.add('hidden'));

      if (tab === 'version') {
        menuVersion.classList.add('active');
        sectionVersion.classList.remove('hidden');
      } else if (tab === 'terms') {
        menuTerms.classList.add('active');
        sectionTerms.classList.remove('hidden');
      }
    }

    menuVersion.addEventListener('click', (e) => { e.preventDefault(); switchTab('version'); });
    menuTerms.addEventListener('click', (e) => { e.preventDefault(); switchTab('terms'); });

    /* --- 編集モード --- */
    editVersionBtn.addEventListener('click', () => {
      editVersionBtn.classList.add('hidden');
      const parts = currentVersion.split('.');
      vMajor.value = parts[0] || '';
      vMinor.value = parts[1] || '';
      vPatch.value = parts[2] || '';
      versionView.classList.add('hidden');
      versionEdit.classList.remove('hidden');
    });

    editTermsBtn.addEventListener('click', () => {
      editTermsBtn.classList.add('hidden');
      termsTitleInput.value = currentTitle;
      termsColorInput.value = currentColor;
      colorCodeText.innerText = currentColor;
      editor.innerHTML = markdownToHtml(currentMarkdownContent);
      termsView.classList.add('hidden');
      termsEdit.classList.remove('hidden');
    });

    function exitEditMode() {
      editVersionBtn.classList.remove('hidden');
      editTermsBtn.classList.remove('hidden');
      versionView.classList.remove('hidden');
      versionEdit.classList.add('hidden');
      termsView.classList.remove('hidden');
      termsEdit.classList.add('hidden');
    }

    cancelVersionBtn.addEventListener('click', exitEditMode);
    cancelTermsBtn.addEventListener('click', exitEditMode);

    /* --- 保存・Discord送信処理の実装 --- */
    
    // バージョン設定の保存
    document.getElementById('save-version-btn').addEventListener('click', async () => {
      const major = vMajor.value.trim();
      const minor = vMinor.value.trim();
      const patch = vPatch.value.trim();

      if (!major || !minor || !patch) {
        alert('すべてのバージョン項目を入力してください。');
        return;
      }

      currentVersion = `${major}.${minor}.${patch}`;
      localStorage.setItem('n84_version', currentVersion);
      
      renderView();
      exitEditMode();

      // RenderサーバーへAPI通信を行う場合（必要に応じてエンドポイントを調整してください）
      try {
        const res = await fetch(`${RENDER_API_URL}/api/update-version`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ version: currentVersion })
        });
        if (res.ok) {
          alert('バージョンを保存し、Discordへ反映しました！');
        } else {
          alert('保存しましたが、Discordへの反映リクエストに失敗しました。');
        }
      } catch (err) {
        console.error(err);
        alert('ローカルに保存しましたが、サーバーへの通信に失敗しました。');
      }
    });

    // 利用規約の保存
    document.getElementById('save-terms-btn').addEventListener('click', async () => {
      currentTitle = termsTitleInput.value;
      currentColor = termsColorInput.value;
      currentMarkdownContent = editor.innerText;

      localStorage.setItem('n84_title', currentTitle);
      localStorage.setItem('n84_color', currentColor);
      localStorage.setItem('n84_content', currentMarkdownContent);

      renderView();
      exitEditMode();

      // RenderサーバーへAPI通信を行う場合（必要に応じてエンドポイントを調整してください）
      try {
        const res = await fetch(`${RENDER_API_URL}/api/update-terms`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: currentTitle,
            color: currentColor,
            content: currentMarkdownContent
          })
        });
        if (res.ok) {
          alert('利用規約を保存し、Discordへ送信しました！');
        } else {
          alert('保存しましたが、Discordへの送信リクエストに失敗しました。');
        }
      } catch (err) {
        console.error(err);
        alert('ローカルに保存しましたが、サーバーへの通信に失敗しました。');
      }
    });
  </script>
</body>
</html>
